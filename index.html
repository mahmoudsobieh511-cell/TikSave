<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORA Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="stars"></div>

    <header>
        <div class="logo">CORA STORE</div>
        <nav>
            <a href="#">الرئيسية</a>
            
            <a href="mailto:mahmoudsobieh@gmail.com" style="color: #00ffcc;">تواصل معنا</a>
</nav>
        </nav>
    </header>

    <div style="text-align: center; margin-top: 20px;">
        <button onclick="openAdminPanel()" style="padding: 10px 20px; background: #00ffcc; color: #000; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; box-shadow: 0 0 10px #00ffcc; font-family: sans-serif;">لوحة التحكم</button>
    </div>

    <section class="hero">
        <h1>متجر CORA Store</h1>
        <p>( روايات - قصص - تعليم الاطفال )</p>
    </section>

    <section class="products">

        <div class="card">
            <img src="https://picsum.photos/400/500?1">
            <h3>صورة احترافية</h3>
            <p>صورة عالية الجودة</p>
            <div class="price">25$</div>
            <button data-name="صورة احترافية" data-price="25">شراء الآن</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/400/500?2">
            <h3>خلفية فضائية</h3>
            <p>جاهزة للتحميل</p>
            <div class="price">40$</div>
            <button data-name="خلفية فضائية" data-price="40">شراء الآن</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/400/500?3">
            <h3>ملف تصميم</h3>
            <p>PSD احترافي</p>
            <div class="price">15$</div>
            <button data-name="ملف تصميم" data-price="15">شراء الآن</button>
        </div>

    </section>

    <script src="app.js"></script>
</body>
</html>
